<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>WebGIS Admin Dashboard</title>

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Geocoder -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.css" />
  <script src="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.js"></script>

  <!-- Leaflet Draw -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet-draw/dist/leaflet.draw.css"/>
  <script src="https://unpkg.com/leaflet-draw/dist/leaflet.draw.js"></script>

   <!-- Kompas -->
  <script src="https://cdn.jsdelivr.net/npm/leaflet-compass/dist/leaflet-compass.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet-compass/dist/leaflet-compass.min.css" />

  <!-- CSS WebGIS -->
  <link rel="stylesheet" href="admin.css">
  
</head>
<body>
  <!-- ================================================
       HEADER BRAND -- ganti gambar dengan upload file ke folder
       "assets/" di repo GitHub kamu, nama file HARUS PERSIS:
         assets/logo-pemkab-mabar.png
         assets/labuan-bajo.jpg   (dipakai sbg background, lihat admin.css)
       Kalau logo belum ada, onerror di bawah otomatis nyembunyiin
       <img>-nya (gak muncul ikon gambar rusak).
  ================================================= -->
  <header id="brandHeader">
    <img src="assets/logo-pemkab-mabar.png" alt="Logo Pemkab Manggarai Barat"
         class="brand-logo" onerror="this.style.display='none'">
    <div class="brand-kabupaten">PEMERINTAH KABUPATEN<br>MANGGARAI BARAT</div>
    <div class="brand-center">
        <div class="brand-title">MANTAP DATA</div>
        <div class="brand-subtitle">Manajemen Terpadu Data Pembangunan</div>
    </div>
    <div class="brand-tagline">"Data Akurat,<br>Pembangunan Tepat Sasaran"</div>
    <nav class="brand-nav">
        <button type="button" class="brand-nav-item" title="Segera hadir">
            <span>🏠</span>Beranda
        </button>
        <button type="button" class="brand-nav-item is-active" title="Halaman ini">
            <span>🗺️</span>Peta Data
        </button>
        <button type="button" class="brand-nav-item" title="Segera hadir">
            <span>📄</span>Laporan
        </button>
        <button type="button" class="brand-nav-item" title="Segera hadir">
            <span>👤</span>Akun
        </button>
    </nav>
  </header>

  <div id="layerTree">
    <div class="tree-header" id="treeMainHeader">
        🗂 Layer
    </div>

    <div id="treeContent"></div>
</div>
  <div id="map"></div>

  <!-- Tombol Button FAB -->
  <div id="fabContainer">
    <div id="fabMenu">
       <div class="fab-group">
        <button id="fabDigitasi" class="fab-item">
            ✏ Digitasi
        </button>
        <div id="digitasiMenu" class="fab-submenu">

            <button id="btnPoint" class="fab-subitem">
                📍 Point
            </button>

            <button id="btnLine" class="fab-subitem">
                📏 Line
            </button>

            <button id="btnPolygon" class="fab-subitem">
                🔺 Polygon
            </button>
       </div>
        
    </div>

    <button id="fabImport" class="fab-item">
            📂 Import
        </button>
   </div>
    <div id="createFab">
        +
    </div>
</div>

  <!-- ================================================
       FOOTER BRAND -- ganti href="#" di bawah dengan link asli akun
       sosmed Bappeda/Pemkab Mabar (urutan: Website, Instagram,
       Facebook, YouTube -- boleh diedit/dihapus sesuai yang ada)
  ================================================= -->
  <footer id="brandFooter">
    <div class="footer-left">📍 Kabupaten Manggarai Barat&nbsp;|&nbsp;NTT - Indonesia</div>
    <div class="footer-center">🏔️ Labuan Bajo — <em>Destinasi Super Prioritas</em></div>
    <div class="footer-right">
        <a href="#" title="Website Bappeda" class="footer-social">🌐</a>
        <a href="#" title="Instagram" class="footer-social">📷</a>
        <a href="#" title="Facebook" class="footer-social">📘</a>
        <a href="#" title="YouTube" class="footer-social">▶️</a>
    </div>
  </footer>

  <!-- Pastikan plugin siap sebelum admin.js jalan -->
<script>
  window.addEventListener('load', function () {
    console.log("All plugins loaded");
  });
</script>

  <!-- Hubungkan file JS terpisah -->
  <script src="admin.js"></script>
</body>
</html>
